name: macOS

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version"
        default: "20261014"
      targets:
        description: "List of targets to build"
        default: '["x86_64-linux-gnu"]'

jobs:
  x-tools:
    runs-on: macos-latest
    strategy:
      matrix:
        target: ${{ fromJSON(github.event.inputs.targets) }}
      fail-fast: false
    steps:
      - name: Check out repo
        uses: actions/checkout@v4
      - name: Build
        run: x-tools/scripts/build-toolchain.sh ${{ matrix.target }}
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version }}
          body: "Roll packages."
          files: x-tools/build/*.tar.xz
